<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>RecNexus - Owner & Coach Control Hub</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d0f12; color: #f3f4f6; margin: 0; padding: 20px; }
        .container { max-width: 1100px; margin: 30px auto; background: #161922; border: 1px solid #2d3748; border-radius: 12px; padding: 35px; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
        h2 { color: #f97316; margin-top: 0; display: flex; align-items: center; gap: 12px; font-size: 26px; }
        p { color: #9ca3af; font-size: 15px; }
        .section-title { color: #f3f4f6; margin-top: 35px; font-size: 18px; border-bottom: 1px solid #2d3748; padding-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin: 25px 0; }
        .stat-card { background: #1e222d; padding: 20px; border-radius: 8px; border: 1px solid #2d3748; text-align: center; }
        .stat-card h3 { margin: 0 0 8px 0; color: #f97316; font-size: 24px; }
        .stat-card span { color: #9ca3af; font-size: 13px; font-weight: 500; }
        .control-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .control-box { background: #1e222d; border: 1px solid #2d3748; border-radius: 8px; padding: 20px; }
        .control-box h4 { margin-top: 0; color: #f97316; font-size: 16px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 5px; }
        .form-control { width: 100%; padding: 10px 12px; background: #0d0f12; border: 1px solid #2d3748; border-radius: 6px; color: #fff; font-size: 14px; box-sizing: border-box; }
        .btn-action { background: #f97316; color: white; border: none; padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background 0.2s; }
        .btn-action:hover { background: #ea580c; }
        .btn-danger { background: #ef4444; }
        .btn-danger:hover { background: #dc2626; }
        .roster-table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #1e222d; border-radius: 8px; overflow: hidden; }
        .roster-table th, .roster-table td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #2d3748; font-size: 14px; }
        .roster-table th { background: #252b3b; color: #f3f4f6; text-transform: uppercase; font-size: 12px; letter-spacing: 0.5px; }
        .badge-owner { background: rgba(249, 115, 22, 0.15); color: #f97316; padding: 4px 8px; border-radius: 4px; font-weight: 600; font-size: 12px; }
        .badge-active { color: #4ade80; font-weight: 600; }
        .btn-logout { margin-top: 35px; background: #2d3748; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        .btn-logout:hover { background: #4a5568; }
    </style>
</head>
<body>
    <div class='container'>
        <div id='dashboardContent'>
            <h2>⚡ Loading Control Hub...</h2>
            <p>Verifying Game Owner & Administration privileges...</p>
        </div>
    </div>

    <script>
        fetch('/api/auth/session')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('dashboardContent');
                if (!data.loggedIn) {
                    window.location.href = '/';
                    return;
                }

                const user = data.user;
                
                container.innerHTML = \
                    <h2>👑 Game Owner & Coach Control Hub</h2>
                    <p>Welcome back, <strong>\</strong>. You have absolute administrative control over servers, match telemetry, squad rosters, and live in-game broadcasts.</p>
                    
                    <div class='stats-grid'>
                        <div class='stat-card'><h3>ONLINE</h3><span>Server Status</span></div>
                        <div class='stat-card'><h3>128 ms</h3><span>Tickrate Latency</span></div>
                        <div class='stat-card'><h3>48 / 50</h3><span>Active Connections</span></div>
                        <div class='stat-card'><h3>100%</h3><span>Cluster Health</span></div>
                    </div>

                    <div class='section-title'>
                        <span>Server & In-Game Controls</span>
                    </div>

                    <div class='control-panel'>
                        <div class='control-box'>
                            <h4>📢 Broadcast Global Announcement</h4>
                            <div class='form-group'>
                                <label>Announcement Message</label>
                                <input type='text' id='broadcastMsg' class='form-control' placeholder='Type global server message...'>
                            </div>
                            <button class='btn-action' onclick='sendBroadcast()'>Push to All Servers</button>
                        </div>

                        <div class='control-box'>
                            <h4>⚙️ Server Infrastructure</h4>
                            <div class='form-group'>
                                <label>Match Engine State</label>
                                <button class='btn-action' style='margin-right: 10px;' onclick='alert("Match server restarted successfully.")'>Restart Match Node</button>
                                <button class='btn-action btn-danger' onclick='alert("Emergency lockdown engaged.")'>Emergency Lockdown</button>
                            </div>
                        </div>
                    </div>

                    <div class='section-title' style='margin-top: 40px;'>
                        <span>Active Master Roster & Permissions</span>
                    </div>

                    <table class='roster-table'>
                        <thead>
                            <tr>
                                <th>User Gamertag / Email</th>
                                <th>Assigned Role</th>
                                <th>Access Level</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>\ (\)</td>
                                <td>Game Owner / Head Coach</td>
                                <td><span class='badge-owner'>ROOT / ADMIN</span></td>
                                <td><span class='badge-active'>Active Session</span></td>
                            </tr>
                            <tr>
                                <td>StrikerPro_01</td>
                                <td>Forward / Player</td>
                                <td>Standard User</td>
                                <td><span class='badge-active'>Ready</span></td>
                            </tr>
                            <tr>
                                <td>MidfieldMaestro</td>
                                <td>Midfielder / Player</td>
                                <td>Standard User</td>
                                <td><span class='badge-active'>Ready</span></td>
                            </tr>
                        </tbody>
                    </table>

                    <button class='btn-logout' onclick='logout()'>Log Out of Control Hub</button>
                \;
            });

        function sendBroadcast() {
            const msg = document.getElementById('broadcastMsg').value;
            if (!msg) {
                alert('Please enter an announcement message.');
                return;
            }
            alert('Broadcast successfully transmitted to all active servers: "' + msg + '"');
            document.getElementById('broadcastMsg').value = '';
        }

        function logout() {
            fetch('/api/auth/logout', { method: 'POST' }).then(() => {
                window.location.href = '/';
            });
        }
    </script>
</body>
</html>
