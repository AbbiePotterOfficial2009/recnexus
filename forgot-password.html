<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecNexus - Reset Password</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
        body {
            background-color: #0b0f19;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            width: 350px;
            text-align: center;
            border: 1px solid #30363d;
        }
        h2 { color: #ff5722; margin-bottom: 10px; }
        p { color: #8b949e; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: 1px solid #30363d;
            background-color: #0d1117;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff5722, #f44336);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { opacity: 0.9; }
        #message { margin-top: 15px; font-size: 14px; }
        .back-link { display: block; margin-top: 15px; color: #58a6ff; text-decoration: none; font-size: 13px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Reset Password</h2>
        <p>Enter your registered email address and we'll send you a secure password reset link.</p>
        
        <form id="forgotForm">
            <input type="email" id="email" placeholder="Email Address" required>
            <button type="submit" id="submitBtn">Send Reset Link</button>
        </form>

        <div id="message"></div>
        <a href="/login.html" class="back-link">← Back to Home / Login</a>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const msgDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');

            msgDiv.style.color = '#8b949e';
            msgDiv.textContent = 'Sending request...';
            submitBtn.disabled = true;

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    msgDiv.style.color = '#3fb950';
                    msgDiv.textContent = data.message || 'If that email exists, a reset link has been sent.';
                } else {
                    msgDiv.style.color = '#f85149';
                    msgDiv.textContent = data.message || 'An error occurred. Please try again.';
                }
            } catch (err) {
                msgDiv.style.color = '#f85149';
                msgDiv.textContent = 'Network error. Please check your connection.';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>

</body>
</html>
