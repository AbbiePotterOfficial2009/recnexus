<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RecNexus - Reset Password</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d0d12; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: #1a1a24; padding: 40px; border-radius: 16px; width: 100%; max-width: 420px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); border: 1px solid rgba(255,107,0,0.2); }
        h2 { color: #f26322; margin-bottom: 8px; font-size: 26px; text-align: center; }
        p { color: #a0a0b0; font-size: 14px; text-align: center; margin-bottom: 24px; }
        .input-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 13px; font-weight: 600; color: #d0d0d8; }
        input { width: 100%; padding: 12px 16px; background: #121218; border: 1px solid #2a2a38; border-radius: 8px; color: #fff; font-size: 15px; transition: border-color 0.2s; }
        input:focus { outline: none; border-color: #f26322; }
        button { width: 100%; padding: 14px; background: linear-gradient(135deg, #f26322, #ff3366); border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .back-link { display: block; text-align: center; margin-top: 20px; color: #a0a0b0; text-decoration: none; font-size: 13px; }
        .back-link:hover { color: #f26322; }
        .msg { margin-top: 15px; text-align: center; font-size: 14px; }
        .success { color: #2ecc71; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Reset Password</h2>
        <p>Enter your registered email address and we'll send you a secure password reset link.</p>
        <form id="resetForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="your.email@example.com">
            </div>
            <button type="submit" id="submitBtn">Send Reset Link</button>
        </form>
        <div id="responseMsg" class="msg"></div>
        <a href="/" class="back-link">← Back to Home / Login</a>
    </div>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const msgEl = document.getElementById('responseMsg');
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.textContent = 'Sending...';
            try {
                const res = await fetch('/api/auth/forgot-password', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email }) });
                const data = await res.json();
                msgEl.textContent = data.message; msgEl.className = data.success ? 'msg success' : 'msg error';
            } catch (err) { msgEl.textContent = 'Network error.'; msgEl.className = 'msg error'; }
            finally { btn.disabled = false; btn.textContent = 'Send Reset Link'; }
        });
    </script>
</body>
</html>
